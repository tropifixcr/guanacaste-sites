# Netlify site for guanacasteroofing.com. In Netlify: base directory empty (repo root), package directory "roofing".
# Paths here are relative to the repo root.
[build]
  command = "npm run build -w roofing"
  publish = "roofing/dist"
  # Only rebuild when this site, the shared code or the dependencies change.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- roofing shared package.json package-lock.json"

[build.environment]
  NODE_VERSION = "22"
