# Netlify site for guanacasteac.com. In Netlify: base directory empty (repo root), package directory "ac".
# Paths here are relative to the repo root.
[build]
  command = "npm run build -w ac"
  publish = "ac/dist"
  # Only rebuild when this site, the shared code or the dependencies change.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ac shared package.json package-lock.json"

[build.environment]
  NODE_VERSION = "22"
