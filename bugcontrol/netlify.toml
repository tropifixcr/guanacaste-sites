# Netlify site for guanacastebugcontrol.com. In Netlify: base directory empty (repo root), package directory "bugcontrol".
# Paths here are relative to the repo root.
[build]
  command = "npm run build -w bugcontrol"
  publish = "bugcontrol/dist"
  # Only rebuild when this site, the shared code or the dependencies change.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- bugcontrol shared package.json package-lock.json"

[build.environment]
  NODE_VERSION = "22"
